[package]
name = "berth-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Minimal Linux/Windows window for Berth"

[[bin]]
name = "berth-gui"
path = "src/main.rs"

[dependencies]
berth-core = { path = "../berth-core" }
berth-headless = { path = "../berth-headless" }
berth-server = { path = "../berth-server" }
serde = { workspace = true }
serde_json.workspace = true
winit.workspace = true
softbuffer.workspace = true
cosmic-text.workspace = true
fontdb.workspace = true
arboard.workspace = true
accesskit.workspace = true
accesskit_winit.workspace = true
ctrlc.workspace = true
png = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Native file picker for the wallpaper path. No GTK: the Linux backend talks to
# the XDG desktop portal, so the window keeps its "no GTK headers" rule.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
regex.workspace = true
global-hotkey = "0.10.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSScreen",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSString",
    "NSURL",
] }
