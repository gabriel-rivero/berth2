[workspace]
resolver = "3"
members = ["crates/berth-core", "crates/berth-cli", "crates/berth-ffi"]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/gabriel-rivero/berth2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
