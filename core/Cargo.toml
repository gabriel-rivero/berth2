[workspace]
resolver = "3"
members = [
    "crates/berth-core",
    "crates/berth-cli",
    "crates/berth-ffi",
    "crates/berth-headless",
    "crates/berth-server",
    "crates/berth-transport",
    "crates/berth-gui",
]

[workspace.package]
version = "0.21.4"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/gabriel-rivero/berth2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local sockets: Unix domain sockets on Unix, named pipes on Windows.
interprocess = "2.4"
getrandom = "0.4"
# PTY + VT screen for the headless shell spike (and future GUI shells).
portable-pty = "0.9"
vt100 = "0.18"
# Embeddable terminal grid/parser for the selectable engine backend.
alacritty_terminal = { version = "0.26", default-features = false }
unicode-width = "0.2"
libc = "0.2"
# Minimal Linux/Windows window: no GTK headers, no GPU required.
winit = "0.30"
softbuffer = "0.4"
# Real text: system font discovery, shaping and glyph rasterisation in-process.
# No fontconfig: fontdb scans the platform font directories itself.
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
# Face identity, to tell a real hit from cosmic-text's fallback substitution.
fontdb = { version = "0.23", default-features = false }
# System clipboard, text only.
arboard = "3"
# Screen-reader support for the window.
accesskit = "0.17"
accesskit_winit = "0.23"
# Ctrl+C and SIGTERM save the session before the window exits.
ctrlc = { version = "3", features = ["termination"] }
# Search: literal or regular expressions with whole-word matching.
regex = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# Same optimisations as release, but with symbols so `sample` and Instruments
# show Rust frames. Use it for measurements only: `make perf-trace`.
[profile.profiling]
inherits = "release"
strip = "none"
debug = 1
