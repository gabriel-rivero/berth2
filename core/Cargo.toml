[workspace]
resolver = "3"
members = [
    "crates/berth-core",
    "crates/berth-cli",
    "crates/berth-ffi",
    "crates/berth-headless",
    "crates/berth-server",
    "crates/berth-transport",
]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/gabriel-rivero/berth2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local sockets: Unix domain sockets on Unix, named pipes on Windows.
interprocess = "2.4"
getrandom = "0.4"
# PTY + VT screen for the headless shell spike (and future GUI shells).
portable-pty = "0.9"
vt100 = "0.18"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
