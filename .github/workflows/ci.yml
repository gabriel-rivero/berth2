name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Needed only by the release step; harmless elsewhere.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The portable core: pure logic, no GPU, no window. Fast and platform-neutral.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: fmt
        run: cargo fmt --all --check
        working-directory: core
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: core
      - name: test
        run: cargo test --workspace
        working-directory: core

      # The generated Swift bindings are committed; regenerate and fail if the
      # checked-in copy drifted from the Rust definitions.
      - name: bindings are current
        run: |
          ./scripts/bindings.sh
          git diff --exit-code -- app/Sources/BerthCore app/Sources/berth_ffiFFI

  # The real product: pinned Ghostty engine + AppKit shell, built into a .app.
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: pinned engine
        id: engine
        run: |
          echo "sha=$(git rev-parse HEAD:vendor/ghostty)" >> "$GITHUB_OUTPUT"
          echo "zig=$(grep -o 'minimum_zig_version = "[^"]*"' vendor/ghostty/build.zig.zon | head -1 | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.engine.outputs.zig }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: ffi

      # Ghostty's build is expensive (~6 min cold); cache the compiler cache and
      # the emitted framework per engine commit so most runs skip it entirely.
      - uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            vendor/ghostty/.zig-cache
            vendor/ghostty/macos/GhosttyKit.xcframework
            vendor/ghostty/zig-out
          key: ghostty-${{ steps.engine.outputs.sha }}-${{ runner.arch }}-${{ steps.engine.outputs.zig }}

      - name: build engine
        run: ./scripts/bootstrap.sh

      # The app links the Rust core as a static library.
      - name: build core library
        run: ./scripts/core-lib.sh

      - name: swift build
        run: swift build -c release --package-path app

      - name: swift test
        run: swift test --package-path app

      - name: bundle app
        run: ./scripts/bundle.sh release

      # A build that needs a library from the runner is not shippable: this is
      # exactly how v0.1.0 shipped with /Users/runner/.../libberth_ffi.dylib.
      - name: bundle is self-contained
        run: |
          bin=build/Berth.app/Contents/MacOS/Berth
          bad=$(otool -L "$bin" | tail -n +2 | awk '{print $1}' \
                | grep -vE '^(/usr/lib/|/System/Library/)' || true)
          if [ -n "$bad" ]; then
            echo "::error::binary links libraries outside the system paths:"
            echo "$bad"
            exit 1
          fi

      - name: archive
        run: ditto -c -k --keepParent build/Berth.app "Berth-${GITHUB_SHA::7}.zip"

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Berth-${{ github.sha }}
          path: Berth-*.zip
          if-no-files-found: error
          retention-days: 30

      # A tag is the release trigger. The app is ad-hoc signed and not
      # notarized, so it ships as a pre-release that people opt into.
      - name: publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Berth-*.zip
          prerelease: true
          generate_release_notes: true
          body: |
            Berth ${{ github.ref_name }} — macOS 14+, Apple Silicon.

            Download `Berth-*.zip`, unzip, and right-click → Open the first time
            (the app is ad-hoc signed, not notarized).

            This build finishes the M2/M3/M4 gaps. Agents appear in the sidebar
            with provider, state, detail and progress; a dead child becomes
            `errored` immediately, attention sorts first, rings the pane, and is
            jumpable with ⌘⇧U (which also acknowledges it) or listable in the
            ⌘I attention panel. macOS banners now fire for agent attention.
            `berth hooks install` wires Claude Code hooks and an OpenCode V2
            `Plugin.define` plugin; the previous bare export failed to load with
            "Expected object at [default]" and is fixed here. `berth run -- <agent>`
            records a resume payload, and relaunch resumes it.

            Protocol and persistence are tightened: `session.save` actually
            saves, `session.restore` replaces live state instead of appending,
            `system.ping` reports real uptime, and `docs/schema/berth.schema.json`
            is generated from the Rust types. The journal is capped at 4 MiB with
            five retained snapshots, and corrupted snapshots are fuzz-tested.
            Split weights now round-trip and drags update the core.

            Display scaling is per-screen: fonts auto-compensate below 2× backing
            scale and can be overridden in Settings without relaunching. New
            diagnostics log launch/restore/socket/agent/UI events and append
            uncaught exceptions to `~/Library/Logs/Berth/crash.log`. The
            attention panel, onboarding screen, compact sidebar and theme tokens
            round out the M4 polish.
