name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Needed only by the release step; harmless elsewhere.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The portable core: pure logic, no GPU, no window. Runs on every desktop OS.
  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: fmt
        run: cargo fmt --all --check
        working-directory: core
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: core
      - name: test
        run: cargo test --workspace
        working-directory: core

      # The window is not exercised by the crate tests. Render one frame under
      # Xvfb and keep it as an artifact, so a rendering regression is visible.
      - name: window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libxkbcommon-x11-0
      - name: window smoke
        if: runner.os == 'Linux'
        run: |
          (cd core && cargo build -p berth-gui)
          ./scripts/gui-smoke.sh core/target/debug/berth-gui "$PWD/gui-frame.png"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        continue-on-error: true
        with:
          name: gui-frame
          path: gui-frame.png
          retention-days: 7

      # The generated Swift bindings are committed; regenerate and fail if the
      # checked-in copy drifted from the Rust definitions. Needs a Unix shell.
      - name: bindings are current
        if: runner.os == 'Linux'
        run: |
          ./scripts/bindings.sh
          git diff --exit-code -- app/Sources/BerthCore app/Sources/berth_ffiFFI

  # The real product: pinned Ghostty engine + AppKit shell, built into a .app.
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: pinned engine
        id: engine
        run: |
          echo "sha=$(git rev-parse HEAD:vendor/ghostty)" >> "$GITHUB_OUTPUT"
          echo "zig=$(grep -o 'minimum_zig_version = "[^"]*"' vendor/ghostty/build.zig.zon | head -1 | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.engine.outputs.zig }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: ffi

      # Ghostty's build is expensive (~6 min cold); cache the compiler cache and
      # the emitted framework per engine commit so most runs skip it entirely.
      - uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            vendor/ghostty/.zig-cache
            vendor/ghostty/macos/GhosttyKit.xcframework
            vendor/ghostty/zig-out
          key: ghostty-${{ steps.engine.outputs.sha }}-${{ runner.arch }}-${{ steps.engine.outputs.zig }}

      - name: build engine
        run: ./scripts/bootstrap.sh

      # The app links the Rust core as a static library.
      - name: build core library
        run: ./scripts/core-lib.sh

      - name: swift build
        run: swift build -c release --package-path app

      - name: swift test
        run: swift test --package-path app

      # Local development on a Mac without Xcode cannot compile Ghostty's Metal
      # shaders, so it cannot run scripts/bootstrap.sh. Publish the engine this
      # job built and `scripts/fetch-engine.sh` drops it in place, which makes
      # `swift build`/`swift test`/`make app` work without a 10 GB Xcode install.
      - name: stage engine
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p engine-artifact/macos engine-artifact/zig-out/share
          cp -R vendor/ghostty/macos/GhosttyKit.xcframework engine-artifact/macos/
          cp -R vendor/ghostty/zig-out/share/ghostty engine-artifact/zig-out/share/

      - name: upload engine
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ghostty-engine-${{ steps.engine.outputs.sha }}
          path: engine-artifact
          retention-days: 90

      - name: bundle app
        run: ./scripts/bundle.sh release

      # Catch placeholders such as ${VERSION} before upload: LaunchServices
      # refuses to open an app whose version keys are not concrete numbers.
      - name: bundle metadata
        run: |
          plist=build/Berth.app/Contents/Info.plist
          plutil -lint "$plist"
          version=$(plutil -extract CFBundleShortVersionString raw "$plist")
          build=$(plutil -extract CFBundleVersion raw "$plist")
          echo "version=$version build=$build"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          [[ "$build" =~ ^[0-9]+$ ]]

      # A build that needs a library from the runner is not shippable: this is
      # exactly how v0.1.0 shipped with /Users/runner/.../libberth_ffi.dylib.
      - name: bundle is self-contained
        run: |
          bin=build/Berth.app/Contents/MacOS/Berth
          bad=$(otool -L "$bin" | tail -n +2 | awk '{print $1}' \
                | grep -vE '^(/usr/lib/|/System/Library/)' || true)
          if [ -n "$bad" ]; then
            echo "::error::binary links libraries outside the system paths:"
            echo "$bad"
            exit 1
          fi

      - name: archive
        run: ditto -c -k --keepParent build/Berth.app "Berth-${GITHUB_SHA::7}.zip"

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Berth-${{ github.sha }}
          path: Berth-*.zip
          if-no-files-found: error
          retention-days: 30

      # Release notes are the tagged CHANGELOG section, so a tag cannot ship a
      # body that still describes the previous release.
      - name: release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "Berth ${GITHUB_REF_NAME} — macOS 14+, Apple Silicon."
            echo
            echo "Download \`Berth-*.zip\`, unzip, and right-click → Open the first"
            echo "time (the app is ad-hoc signed, not notarized)."
            echo
          } > release-notes.md
          awk -v ver="$version" '
            $0 ~ "^## " ver "$" { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md >> release-notes.md
          if ! grep -q "^### " release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      # A tag is the release trigger. The app is ad-hoc signed and not
      # notarized, so it ships as a pre-release that people opt into.
      - name: publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Berth-*.zip
          prerelease: true
          name: Berth ${{ github.ref_name }}
          body_path: release-notes.md
